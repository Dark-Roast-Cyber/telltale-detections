name: Detection request
description: Describe agent behavior that Telltale should detect.
labels: [detection-request]
body:
  - type: markdown
    attributes:
      value: >-
        Use synthetic examples only. Do not paste real session transcripts,
        credentials, hostnames, or personal paths. Report Telltale security
        vulnerabilities through its security policy instead.
  - type: textarea
    id: behavior
    attributes:
      label: Behavior
      description: What does the agent request or do, and why is it risky?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Synthetic example
      description: A fabricated tool call or command showing the behavior.
      render: text
    validations:
      required: true
  - type: textarea
    id: benign
    attributes:
      label: Benign look-alikes
      description: Legitimate developer activity that looks similar and should not alert.
    validations:
      required: true
  - type: textarea
    id: visibility
    attributes:
      label: Visibility
      description: Which agents or session sources record this evidence, if known?
