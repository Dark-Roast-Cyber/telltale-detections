version: 1
description: Community detection of MCP server registration commands in agent sessions.
defaults:
  case_insensitive: true
  enabled: true
rules:
  - id: tdx.persistence.mcp_server_registration
    title: MCP server registered by an agent command
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: medium
    score: 40
    targets: [command, arguments]
    regex: '(?:^|[\s''";&|])(?:(?:codex|claude|opencode)[ \t]+mcp[ \t]+add[ \t]+(?:(?:--client-secret|(?:--(?:bearer-token-env-var|callback-port|client-id|env|header|scope|transport|url)|-[Hest])(?:[ \t]+|=)(?:\\?[''"][^''"\r\n]*\\?[''"]|[^\s''";&|<>]+))[ \t]+)*(?:--[ \t]+)?(?:\\?[''"])?[a-z0-9_.$]|opencode[ \t]+mcp[ \t]+add[ \t]*(?:$|[;&|\r\n<>]|\\?[''"][ \t]*(?:$|[,;&|}\]\r\n<>])))'
    tags: [mcp, tool-surface, configuration, persistence]
    explanation: An agent tool request contains a named MCP add command or the bare OpenCode registration wizard; successful registration and expansion of the tool surface require confirmation.
    falsepositives:
      - Authorized developer setup may register an approved local or organizational MCP server.
      - Integration tests may exercise an MCP add command against a synthetic server.
      - Help requested after a server name and quoted registration examples can match without changing configuration.
modifiers: []
