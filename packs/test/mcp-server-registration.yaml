version: 1
description: Community detection of MCP server registration commands in agent sessions.
defaults:
  case_insensitive: true
  enabled: true
rules:
  - id: tdx.persistence.mcp_server_registration
    title: MCP server registered by an agent command
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: medium
    score: 40
    targets: [command, arguments]
    regex: '(^|[\s''"])(codex|claude|opencode)\s+mcp\s+add(?:\s|\\?[''"]|$)'
    tags: [mcp, tool-surface, configuration, persistence]
    explanation: An agent tool request contains a supported client MCP add entrypoint; successful registration and expansion of the tool surface require confirmation.
    falsepositives:
      - Authorized developer setup may register an approved local or organizational MCP server.
      - Integration tests may exercise an MCP add command against a synthetic server.
      - MCP add help and quoted registration examples can match without changing configuration.
modifiers: []
