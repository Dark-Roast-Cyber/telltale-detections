version: 1
description: Community detection of repository Git-hook persistence changes in agent sessions.
defaults:
  case_insensitive: true
  enabled: true
rules:
  - id: tdx.persistence.git_hook_change
    title: Git hook path or hook program changed by an agent
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: high
    score: 50
    targets: [command, arguments]
    regex: '(git[ \t]+config(?:[ \t]+--(?:local|global|system|add|replace-all))*[ \t]+core\.hooksPath[ \t]+[^\s;&|<>#)]+|(?s:(\.git[\\/]hooks[\\/][A-Za-z0-9._-]+.{0,400}#!|#!.{0,400}\.git[\\/]hooks[\\/][A-Za-z0-9._-]+)))'
    tags: [git, hooks, persistence, repository]
    explanation: An agent tool request contains a hook configuration pattern or nearby hook-path and shebang text; a write or later hook execution requires confirmation.
    falsepositives:
      - Authorized repository setup may install versioned hooks or configure a team-approved hooks directory.
      - Hook framework installation may create executable hook shims as part of an explicitly requested developer setup.
      - Read-only shebang inspection and quoted hook examples can contain the same hook-path and shebang text.
modifiers: []
