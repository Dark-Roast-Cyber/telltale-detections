version: 1
description: Community command-level Windows persistence detections for agent sessions.
defaults:
  case_insensitive: true
  enabled: true
rules:
  - id: tdx.persistence.windows_agent_command
    title: Windows persistence command in an agent tool call
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: high
    score: 55
    targets: [command, arguments]
    regex: '(schtasks(?:\.exe)?\s+.{0,200}/create\b|\b(?:register|set)-scheduledtask\b[^|;&\r\n]{0,400}?\s-(?:taskname|action|trigger|xml|inputobject)\b|(?:reg(?:\.exe)?\s+add\s+|\b(?:set|new)-itemproperty\s+(?:[^|;&\r\n]{0,240}?-(?:literal)?path:?\s*)?)(?:\\?["''])?(?:registry::)?HK(?:CU|LM|EY_(?:CURRENT_USER|LOCAL_MACHINE)):?[\\/]+Software[\\/]+Microsoft[\\/]+(?:Windows[\\/]+CurrentVersion[\\/]+(?:Run(?:Once(?:Ex(?:[\\/]+\w+)?)?)?|Policies[\\/]+Explorer[\\/]+Run)|Windows NT[\\/]+CurrentVersion[\\/]+Winlogon)(?:\\?["'']|\s|$)|(?:x?copy|move|robocopy|(?:copy|move)-item(?:\s+-(?:literal)?path)?)\s+(?:/-?Y\s+){0,2}(?:\\?["''][^"''\r\n]{1,240}["'']|[^\s"''/-][^\s"'']{0,239})\s+(?:-destination:?\s*)?(?:\\?["''][^"''\r\n]{0,240}[\\/]+Startup(?:[\\/][^"''\r\n]{0,240})?\\?["'']|[^\s"'']{0,240}[\\/]+Startup(?:[\\/][^\s"'']{0,240})?(?:\s|\\?["'']|$))|-destination[:\s]+[^|;&\r\n]{0,120}?shell:(?:common\s?)?startup\b|shell:(?:common\s?)?startup\b[^|;&\r\n]{0,120}?\.(?:copy|move)here\b)'
    tags: [windows, persistence, scheduled-task, run-key, startup-folder, powershell]
    explanation: An agent tool call attempts a Windows scheduled-task, autorun-key, or startup-folder persistence change through cmd tools or PowerShell cmdlets, without requiring process parent-child telemetry.
    falsepositives:
      - Authorized endpoint administration may create scheduled tasks, configure approved autorun software, or install a requested startup shortcut.
      - Quoted command examples, arbitrary folders named Startup, and ordinary Winlogon settings can match without establishing persistence.
      - PowerShell -WhatIf previews match like the real command; the regex cannot exclude the switch.
  - id: tdx.persistence.windows_service_change
    title: Windows service install or autostart change in an agent tool call
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: high
    score: 55
    targets: [command, arguments]
    regex: '(\bnew-service\b[^|;&\r\n]{0,400}?\s-(?:name|binarypathname)\b|\bset-service\b[^|;&\r\n]{0,400}?\s-startuptype[:\s]+\\?["'']?automatic|\bsc(?:\.exe)?\\?["'']?\s+(?:\\\\\S+\s+)?(?:create|config)\s+\S+[^|;&\r\n]{0,400}?\b(?:binpath\s*=|start\s*=\s*\\?["'']?(?:auto|delayed-auto)\b))'
    tags: [windows, persistence, service, powershell]
    explanation: An agent tool call creates a Windows service, points an existing service at a new binary, or sets a service to start automatically.
    falsepositives:
      - Authorized administration and requested software installs can create services or enable automatic start.
      - Quoted command examples with service arguments can match without changing a service.
      - PowerShell -WhatIf previews match like the real command; the regex cannot exclude the switch.
  - id: tdx.persistence.powershell_profile_write
    title: PowerShell profile write in an agent tool call
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: medium
    score: 45
    targets: [command, arguments]
    regex: '((?:\b(?:add-content|set-content|out-file|tee-object)\s+(?:[^|;&\r\n]{0,240}?-(?:literal|file)?path:?\s*)?|>>?\s*|\b(?:copy|move)-item\b[^|;&\r\n]{0,240}?\s-destination:?\s*|\b(?:copy-item|move-item|cp|copy|mv|move)\s+(?:-(?:literal)?path\s+)?(?:\\?["''][^"''\r\n]{1,240}["'']|[^\s"''-][^\s"'']{0,239})\s+)(?:\\?["''])?(?:\$profile(?:\.(?:all|current)users?(?:all|current)hosts?)?|(?:\$pshome|(?:\\?["''][^"''\r\n]{0,240}|[^\s"''|;]{0,240})[\\/](?:windows)?powershell)[\\/]+(?:microsoft\.[a-z.]{1,40}_)?profile\.ps1)(?:\\?["'']|[\s;|)]|$))'
    tags: [windows, persistence, powershell, profile]
    explanation: An agent tool call writes, appends to, or replaces a PowerShell profile script, which runs in every later PowerShell session of that user or host.
    falsepositives:
      - Requested shell setup, such as adding a module import or alias, writes the profile in the same way.
      - Quoted command examples can match without changing the profile.
      - PowerShell -WhatIf previews match like the real command; the regex cannot exclude the switch.
  - id: tdx.persistence.wmi_event_subscription
    title: WMI permanent event subscription created in an agent tool call
    status: test
    category: persistence
    detection_class: security_detection
    signal_type: atomic
    analytic_intent: alert
    severity: high
    score: 55
    targets: [command, arguments]
    regex: '(\b(?:set-wmiinstance|new-ciminstance)\b(?:[^|;&\r\n]{0,400}?(?:@\{[^}\r\n]{0,400}\}[^|;&\r\n]{0,200}?)?\s-class(?:name)?[:\s]+|\s+)\\?["'']?(?:__eventfilter|commandlineeventconsumer|activescripteventconsumer|__filtertoconsumerbinding)\b|\[wmiclass\][^|;&\r\n]{0,200}?(?:__eventfilter|commandlineeventconsumer|activescripteventconsumer|__filtertoconsumerbinding)[^|;&\r\n]{0,120}?\.createinstance\b|\bwmic\b[^|;&\r\n]{0,400}?(?:__eventfilter|commandlineeventconsumer|activescripteventconsumer|__filtertoconsumerbinding)\\?["'']?\s+create\b)'
    tags: [windows, persistence, wmi, powershell]
    explanation: An agent tool call creates a WMI event filter, command-line or script consumer, or filter-to-consumer binding, which can run a command on a system event without a logon.
    falsepositives:
      - Endpoint management and monitoring software can register WMI event subscriptions with administrator approval.
      - Quoted command examples can match without creating a subscription.
      - PowerShell -WhatIf previews match like the real command; the regex cannot exclude the switch.
modifiers: []
